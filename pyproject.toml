[project]
name = "tootflow"
version = "1.0.0"
description = "Plan, draft, and automate Mastodon & X campaigns — free and open source."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "pydantic-settings==2.5.2",
    "uvicorn[standard]==0.30.6",
    "sqlmodel==0.0.21",
    "sqlalchemy==2.0.36",
    "jinja2==3.1.4",
    "python-multipart==0.0.12",
    "python-jose[cryptography]==3.3.0",
    "httpx==0.28.1",
    "apscheduler==3.10.4",
    "openai==1.52.0",
    "itsdangerous==2.2.0",
    "python-dotenv==1.0.1",
    "aiofiles==24.1.0",
    "slowapi==0.1.9",
    "psycopg2-binary==2.9.9",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
]

[project.scripts]
tootflow = "app.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]

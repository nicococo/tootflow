services:

  traefik:
    image: traefik:v3.0
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certs:/letsencrypt
    command:
      - --log.level=WARN
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      # HTTP → HTTPS redirect
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      # Let's Encrypt via HTTP-01 challenge
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.email=hello@tootflow.com
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
    networks:
      - proxy

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=tootflow_proxy"

      # — Apex domain (tootflow.com) —
      - "traefik.http.routers.app.rule=Host(`tootflow.com`)"
      - "traefik.http.routers.app.entrypoints=websecure"
      - "traefik.http.routers.app.tls.certresolver=letsencrypt"
      - "traefik.http.services.app.loadbalancer.server.port=8000"

      # — www → apex permanent redirect —
      - "traefik.http.routers.app-www.rule=Host(`www.tootflow.com`)"
      - "traefik.http.routers.app-www.entrypoints=websecure"
      - "traefik.http.routers.app-www.tls.certresolver=letsencrypt"
      - "traefik.http.routers.app-www.middlewares=www-redirect"
      - "traefik.http.middlewares.www-redirect.redirectregex.regex=^https://www\\.tootflow\\.com/(.*)"
      - "traefik.http.middlewares.www-redirect.redirectregex.replacement=https://tootflow.com/$${1}"
      - "traefik.http.middlewares.www-redirect.redirectregex.permanent=true"
    networks:
      - proxy

networks:
  proxy:
    driver: bridge

volumes:
  traefik-certs:

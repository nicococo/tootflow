services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Keep the SQLite DB on the persistent volume
      DATABASE_URL: sqlite:////data/tootflow.db
    volumes:
      - app-data:/data          # SQLite database lives here
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Optional PostgreSQL — docker compose --profile postgres up -d
  # and set DATABASE_URL=postgresql://tootflow:tootflow@db:5432/tootflow in .env
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: tootflow
      POSTGRES_PASSWORD: tootflow
      POSTGRES_DB: tootflow
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tootflow"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  app-data:
  db-data:

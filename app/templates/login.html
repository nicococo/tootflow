{% extends "base.html" %}
{% block title %}Sign In – TootFlow{% endblock %}
{% block content %}
<div class="container" style="max-width:400px;">
  <h1>Sign In</h1>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="/login" style="background:var(--white); border:var(--border); padding:28px;">
    <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
    <div class="form-group">
      <label for="instance_url">Mastodon Instance</label>
      <input type="text" id="instance_url" name="instance_url"
        placeholder="https://mastodon.social" required autofocus>
    </div>
    <button type="submit" class="btn btn-primary" style="width:100%;">Continue with Mastodon →</button>
  </form>
  <p style="margin-top:16px; font-size:13px; color:var(--muted);">
    You'll be redirected to your Mastodon instance to authorise TootFlow.
    An account is created automatically on first sign-in.
  </p>
</div>
{% endblock %}
